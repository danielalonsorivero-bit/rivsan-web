# Versión de muestra para clientes en GitHub Pages:
# https://danielalonsorivero-bit.github.io/rivsan-web/
# Se publica en cada push a main. Compila en la subcarpeta /rivsan-web/,
# sin indexar y con pantalla de contraseña (barrera de cortesía).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://danielalonsorivero-bit.github.io
          BASE_PATH: /rivsan-web
          # SHA-256 de la contraseña de acceso (no la contraseña en claro)
          PUBLIC_PASSWORD_HASH: 550af0795e2cccb5c69be9cdf991a950ec5d844236d62a005b5fe56412b72816
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
